services:
  db:
    image: postgres
    container_name: stethoscope-db
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
    container_name: stethoscope-web
    env_file: .env
    environment:
      - DB_HOST=db
    command: >
      sh -c "stethoscope migrate &&
             stethoscope collectstatic --no-input &&
             stethoscope runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
