<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Stethoscope{% endblock %} — Stethoscope</title>
  <style>
    /* Unfold-matching color palette */
    :root {
      --color-base-50:  oklch(98%   0.003 230);
      --color-base-100: oklch(95%   0.006 230);
      --color-base-200: oklch(90%   0.010 230);
      --color-base-300: oklch(83%   0.015 230);
      --color-base-400: oklch(70%   0.020 230);
      --color-base-500: oklch(56%   0.025 230);
      --color-base-600: oklch(44%   0.028 230);
      --color-base-700: oklch(36%   0.030 230);
      --color-base-800: oklch(27%   0.030 230);
      --color-base-900: oklch(20%   0.028 230);
      --color-base-950: oklch(13%   0.024 230);

      --color-primary-50:  oklch(97%   0.018 220);
      --color-primary-100: oklch(93%   0.040 220);
      --color-primary-200: oklch(88%   0.075 220);
      --color-primary-300: oklch(80%   0.120 220);
      --color-primary-400: oklch(68%   0.175 220);
      --color-primary-500: oklch(56%   0.215 220);
      --color-primary-600: oklch(47%   0.220 220);
      --color-primary-700: oklch(40%   0.200 220);
      --color-primary-800: oklch(33%   0.170 220);
      --color-primary-900: oklch(27%   0.140 220);
      --color-primary-950: oklch(18%   0.110 220);

      --radius: 6px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.9375rem;
      line-height: 1.6;
      background-color: var(--color-base-100);
      color: var(--color-base-900);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .card {
      background: white;
      border: 1px solid var(--color-base-200);
      border-radius: var(--radius);
      padding: 2.5rem;
      width: 100%;
      max-width: 540px;
      box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.07), 0 1px 2px -1px rgb(0 0 0 / 0.07);
    }

    .site-header {
      display: flex;
      align-items: center;
      gap: 0.625rem;
      margin-bottom: 2rem;
    }

    .site-header__icon {
      width: 2rem;
      height: 2rem;
      background-color: var(--color-primary-600);
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .site-header__icon svg {
      width: 1.125rem;
      height: 1.125rem;
      stroke: white;
      fill: none;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .site-header__text {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
    }

    .site-header__title {
      font-size: 0.9375rem;
      font-weight: 700;
      color: var(--color-base-900);
      letter-spacing: -0.01em;
    }

    .site-header__subtitle {
      font-size: 0.75rem;
      color: var(--color-base-500);
    }

    .divider {
      border: none;
      border-top: 1px solid var(--color-base-200);
      margin: 1.75rem 0;
    }

    h1 {
      font-size: 1.125rem;
      font-weight: 700;
      color: var(--color-base-900);
      letter-spacing: -0.01em;
      margin-bottom: 0.5rem;
    }

    p {
      font-size: 0.9375rem;
      color: var(--color-base-600);
      margin-bottom: 1rem;
    }

    p:last-child {
      margin-bottom: 0;
    }

    .meta-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 1.5rem;
      font-size: 0.875rem;
    }

    .meta-table td {
      padding: 0.5rem 0;
      vertical-align: top;
    }

    .meta-table td:first-child {
      width: 40%;
      color: var(--color-base-500);
      font-weight: 500;
    }

    .meta-table td:last-child {
      color: var(--color-base-800);
      font-weight: 500;
    }

    .meta-table tr + tr td {
      border-top: 1px solid var(--color-base-100);
    }

    /* Warning notice */
    .notice {
      display: flex;
      gap: 0.75rem;
      padding: 0.875rem 1rem;
      border-radius: var(--radius);
      margin-bottom: 1.5rem;
      font-size: 0.875rem;
      line-height: 1.5;
    }

    .notice--warning {
      background-color: oklch(97% 0.025 80);
      border: 1px solid oklch(88% 0.07 80);
      color: oklch(38% 0.08 80);
    }

    .notice--error {
      background-color: oklch(97% 0.018 20);
      border: 1px solid oklch(88% 0.06 20);
      color: oklch(38% 0.10 20);
    }

    .notice__icon {
      flex-shrink: 0;
      width: 1.125rem;
      height: 1.125rem;
      margin-top: 0.1rem;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Token display */
    .token-display {
      background-color: var(--color-base-950);
      border-radius: var(--radius);
      padding: 1rem 1.25rem;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .token-display__value {
      font-family: ui-monospace, "Cascadia Code", "Source Code Pro", Menlo, Consolas, monospace;
      font-size: 0.8125rem;
      color: var(--color-primary-300);
      word-break: break-all;
      flex: 1;
      user-select: all;
    }

    .token-display__copy {
      flex-shrink: 0;
      background: none;
      border: 1px solid var(--color-base-700);
      border-radius: var(--radius);
      padding: 0.3rem 0.6rem;
      cursor: pointer;
      color: var(--color-base-400);
      font-size: 0.75rem;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      transition: border-color 0.15s, color 0.15s;
    }

    .token-display__copy:hover {
      border-color: var(--color-base-500);
      color: var(--color-base-200);
    }

    .token-display__copy svg {
      width: 0.875rem;
      height: 0.875rem;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Buttons */
    .btn-group {
      display: flex;
      gap: 0.75rem;
      margin-top: 1.75rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      padding: 0.5625rem 1.125rem;
      border-radius: var(--radius);
      font-size: 0.875rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      text-decoration: none;
      border: 1px solid transparent;
      transition: background-color 0.15s, border-color 0.15s, color 0.15s;
      line-height: 1;
    }

    .btn--primary {
      background-color: var(--color-primary-600);
      color: white;
      border-color: var(--color-primary-600);
    }

    .btn--primary:hover {
      background-color: var(--color-primary-700);
      border-color: var(--color-primary-700);
    }

    .btn--secondary {
      background-color: white;
      color: var(--color-base-700);
      border-color: var(--color-base-200);
    }

    .btn--secondary:hover {
      background-color: var(--color-base-50);
      border-color: var(--color-base-300);
    }

    .btn svg {
      width: 0.9375rem;
      height: 0.9375rem;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Status badge */
    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      font-size: 0.8125rem;
      font-weight: 600;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
    }

    .status--active {
      background-color: oklch(93% 0.05 155);
      color: oklch(32% 0.10 155);
    }

    .status--inactive {
      background-color: var(--color-base-100);
      color: var(--color-base-500);
    }

    .status::before {
      content: '';
      display: inline-block;
      width: 0.4375rem;
      height: 0.4375rem;
      border-radius: 50%;
      background-color: currentColor;
    }

    {% block extra_styles %}{% endblock %}
  </style>
</head>
<body>
  <div class="card">
    <div class="site-header">
      <div class="site-header__icon">
        <!-- Stethoscope icon -->
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M4.8 2.3A.3.3 0 1 0 5 2H4a2 2 0 0 0-2 2v5a6 6 0 0 0 6 6 6 6 0 0 0 6-6V4a2 2 0 0 0-2-2h-1a.2.2 0 1 0 .3.3"/>
          <path d="M8 15v1a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6v-4"/>
          <circle cx="20" cy="10" r="2"/>
        </svg>
      </div>
      <div class="site-header__text">
        <span class="site-header__title">Stethoscope</span>
        <span class="site-header__subtitle">License Management</span>
      </div>
    </div>

    <hr class="divider">

    {% block content %}{% endblock %}
  </div>

  {% block scripts %}{% endblock %}
</body>
</html>
