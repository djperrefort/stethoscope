name: 🤖 Publish Package

on:
  workflow_call:
    inputs:
      version:
        description: 'Set the version number of the published application.'
        default: '0.0.0'
        required: false
        type: string

jobs:  
  publish:
    runs-on: ubuntu-latest
    name: Publish Images
    
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(inputs.matrix) }}
    
    steps:
      - name: Fetch image artifact
        uses: actions/download-artifact@v7
        with:
          name: stethoscope-docker
          path: /tmp

      - name: Load image
        run: docker load --input /tmp/stethoscope.tar

      - name: Define Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/better-hpc/stethoscope
          tags: |
            type=raw,value=${{ matrix.version }}
          labels: |
            org.opencontainers.image.title="Stethoscope"
            org.opencontainers.image.description="A lightweight application licensing server."
            org.opencontainers.image.url="https://github.com/better-hpc/stethoscope"
            org.opencontainers.image.source="https://github.com/better-hpc/stethoscope"
            org.opencontainers.image.authors="Better HPC LLC"
            org.opencontainers.image.revision="${{ github.sha }}"
            org.opencontainers.image.vendor="Better HPC LLC"
            org.opencontainers.image.ref.name="ghcr.io/better-hpc/stethoscope:${{ matrix.version }}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      # Architectures must be built individually when `load: true`
      - name: Build amd64
        uses: docker/build-push-action@v6
        with:
          load: true
          platforms: linux/amd64
          cache-from: type=gha

      - name: Build arm64
        uses: docker/build-push-action@v6
        with:
          load: true
          platforms: linux/arm64
          cache-from: type=gha

      # Container registry credentials are only valid for a short timespan
      # Compile long-running builds before authenticating
      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        uses: docker/build-push-action@v6
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
